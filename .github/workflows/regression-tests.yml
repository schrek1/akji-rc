name: Regression Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep coreutils

      - name: Run regression tests
        run: |
          chmod +x app/test_capture.sh
          chmod +x app/capture.sh
          bash app/test_capture.sh

      - name: Run Go integration test
        env:
          WEBCAM_URL: ${{ vars.WEBCAM_URL }}
          WEBCAM_USER: ${{ vars.WEBCAM_USER }}
          WEBCAM_PASS: ${{ secrets.WEBCAM_PASS }}
        run: |
          set -euo pipefail
          go run ./cmd/akji-capture --out "$RUNNER_TEMP/go-integration-frame.jpg"
          chmod +x app/ci/validate_frame.sh
          app/ci/validate_frame.sh "$RUNNER_TEMP/go-integration-frame.jpg"
