name: Regression Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Run Go integration test
        env:
          WEBCAM_URL: ${{ vars.WEBCAM_URL }}
          WEBCAM_USER: ${{ vars.WEBCAM_USER }}
          WEBCAM_PASS: ${{ secrets.WEBCAM_PASS }}
        run: |
          set -euo pipefail
          go run ./cmd/akji-capture --out "$RUNNER_TEMP/go-integration-frame.jpg"
          go run ./cmd/akji-validate "$RUNNER_TEMP/go-integration-frame.jpg"
